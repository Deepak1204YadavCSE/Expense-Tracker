<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Analytics Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <!-- Chart.js Library -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    

    <!-- Navigation Bar -->
    <nav class="main-nav">
        
        <!-- Fixed Logo: Hollow Green Circle + Perfect Vertical Alignment -->
        <div class="nav-logo" style="display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: 20px;">
            
            <!-- Hollow Circle Wrapper (Green Border, White Background) -->
            <div style="display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; background-color: #ffffff; border: 2px solid var(--success-color); border-radius: 50%; flex-shrink: 0; vertical-align: middle;">
                
                <!-- Green Infinity Icon -->
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--success-color)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="display: block;">
                    <path d="M12 12c-2-2.5-4-5-7-5a5 5 0 1 0 0 10c3 0 5-2.5 7-5z"></path>
                    <path d="M12 12c2 2.5 4 5 7 5a5 5 0 1 0 0-10c-3 0-5 2.5-7 5z"></path>
                </svg>
                
            </div>

            <!-- Two-Tone Text -->
            <span style="color: var(--primary); display: inline-flex; align-items: center; line-height: 1;">Fin<span style="color: var(--success-color);">Track</span></span>
        </div>

        <!-- Existing Links -->
        <ul class="nav-links">
            <li><a href="#" class="active">Dashboard</a></li>
            <li><a href="#">History</a></li>
            <li><a href="#">Settings</a></li>
        </ul>
        
    </nav>

    <div class="dashboard-container">
        
        <!-- 1. TOP TIER: Summary Card -->
        <header>
            <div class="summary-card">
                <h2>Total Balance</h2>
                <h3 id="total-balance">$0.00</h3>
            </div>
        </header>

        <!-- 2. MIDDLE TIER: Form (Left) and Chart (Right) -->
        <main class="action-tier">
            <!-- Input Form -->
            <section class="form-section">
                <h3>Add New Transaction</h3>
                <form id="expense-form">
                    <div class="form-control">
                        <label for="description">Description</label>
                        <input type="text" id="description" placeholder="e.g., Grocery shopping" required>
                    </div>
                    <div class="form-control">
                        <label for="amount">Amount</label>
                        <input type="number" id="amount" placeholder="Enter amount" step="0.01" required>
                    </div>
                    <div class="form-control">
                        <label for="category">Category</label>
                        <select id="category">
                            <option value="Food">Food & Dining</option>
                            <option value="Transport">Transportation</option>
                            <option value="Utilities">Utilities</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Other">Other Expenses</option> <!-- Add this line -->
                        </select>
                    </div>
                    <button type="submit">Add Transaction</button>
                </form>
            </section>

            <!-- Data Visualization -->
            <section class="chart-section">
                <h3>Spending Breakdown</h3>
                <!-- Add this strict wrapper div around the canvas -->
                <div style="position: relative; height: 300px; width: 100%;">
                    <canvas id="expenseChart"></canvas>
                </div>
            </section>
        </main>

        <!-- 3. BOTTOM TIER: Transaction History (Full Width) -->
        <section class="history-section full-width">
            <h3>Transaction History</h3>
            <ul id="transaction-list">
                <!-- JavaScript will dynamically inject list items here -->
            </ul>
        </section>

    </div>

    <!-- Client-Side JavaScript Scripts -->
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
